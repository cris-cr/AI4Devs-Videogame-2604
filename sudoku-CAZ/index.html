<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Sudoku</h1>
            <div class="timer" id="timer">00:00</div>
        </div>

        <div class="controls">
            <button id="resetButton" class="reset-button">Reset Board</button>
        </div>

        <div class="game-board">
            <div id="sudokuGrid" class="sudoku-grid">
                <!-- Grid cells will be generated by JavaScript -->
            </div>
        </div>

        <div class="info-panel">
            <p id="selectedInfo">Click a cell to select</p>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal hidden">
        <div class="modal-content">
            <h2>🎉 Congratulations!</h2>
            <p class="completion-message">You completed the Sudoku board!</p>
            <p class="time-display">Time: <span id="finalTime">00:00</span></p>
            <button id="newGameButton" class="new-game-button">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
